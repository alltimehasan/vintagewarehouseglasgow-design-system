<!-- @dsCard group="Shop" height=640 width=1100 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProductCard — preview</title></head>
<body class="vwg-paper">
<div class="vwg-grid" style="padding: var(--space-4)">
  <article class="vwg-card">
    <a class="vwg-card-media" href="#">
      <img src="/_blob/2415ab446fded8dbda175d6c5c6ab8e8" alt="Mixed vintage bag, about 20 kg">
      <span class="vwg-stamp vwg-card-stamp">Vintage</span>
    </a>
    <div class="vwg-card-body">
      <h3 class="vwg-card-title"><a href="#">Mixed vintage bag</a></h3>
      <p class="vwg-card-meta">Approx. 20 kg · 60–80 pieces · mixed sizes</p>
      <div class="vwg-card-foot">
        <p class="vwg-price"><span class="vwg-tag">£60.00</span> <small>UK delivery only</small></p>
        <button class="vwg-btn vwg-btn-primary vwg-btn-sm" type="button">Add to basket</button>
      </div>
    </div>
  </article>
  <article class="vwg-card">
    <a class="vwg-card-media" href="#">
      <img src="/_blob/e0dbebc9b5d1c003b645c344857e8a22" alt="Branded outlet bag, about 15 kg">
      <span class="vwg-stamp vwg-stamp-new vwg-card-stamp">New</span>
    </a>
    <div class="vwg-card-body">
      <h3 class="vwg-card-title"><a href="#">Branded outlet bag</a></h3>
      <p class="vwg-card-meta">Approx. 15 kg · 40–50 pieces · with tags</p>
      <div class="vwg-card-foot">
        <p class="vwg-price"><span class="vwg-tag">£95.00</span> <small>UK delivery only</small></p>
        <button class="vwg-btn vwg-btn-primary vwg-btn-sm" type="button">Add to basket</button>
      </div>
    </div>
  </article>
  <article class="vwg-card vwg-card-sold">
    <a class="vwg-card-media" href="#">
      <img src="/_blob/2415ab446fded8dbda175d6c5c6ab8e8" alt="Vintage denim bag, about 20 kg">
      <span class="vwg-stamp vwg-card-stamp">Vintage</span>
      <span class="vwg-stamp vwg-stamp-sold vwg-stamp-lg vwg-card-stamp-lg">Sold out</span>
    </a>
    <div class="vwg-card-body">
      <h3 class="vwg-card-title"><a href="#">Vintage denim bag</a></h3>
      <p class="vwg-card-meta">Approx. 20 kg · 40–50 pieces · jeans and jackets</p>
      <div class="vwg-card-foot">
        <p class="vwg-price"><span class="vwg-tag">£75.00</span> <small>UK delivery only</small></p>
        <button class="vwg-btn vwg-btn-primary vwg-btn-sm" type="button" disabled>Sold out</button>
      </div>
    </div>
  </article>
</div>
</body>
</html>
