<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pagination — preview</title></head>
<body class="vwg-paper">
<div class="vwg-container" style="display: grid; gap: var(--space-8); padding-top: var(--space-6); padding-bottom: var(--space-6)">
  <nav class="vwg-filter" aria-label="Filter the bags">
    <a class="vwg-btn vwg-btn-outline vwg-btn-sm" href="#" aria-current="true">All bags</a>
    <a class="vwg-btn vwg-btn-outline vwg-btn-sm" href="#">Vintage</a>
    <a class="vwg-btn vwg-btn-outline vwg-btn-sm" href="#">New</a>
  </nav>
  <nav class="vwg-pagination" aria-label="Pages of bags">
    <a class="vwg-btn vwg-btn-outline vwg-btn-sm" href="#" rel="prev">Previous</a>
    <ul>
      <li><a href="#">1</a></li>
      <li><a href="#" aria-current="page">2</a></li>
      <li><a href="#">3</a></li>
      <li><span aria-hidden="true">…</span></li>
      <li><a href="#">8</a></li>
    </ul>
    <a class="vwg-btn vwg-btn-outline vwg-btn-sm" href="#" rel="next">Next</a>
  </nav>
</div>
</body>
</html>
