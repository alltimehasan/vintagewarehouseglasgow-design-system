<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/tokens.css">
<link rel="stylesheet" href="../dist/vwg.css">
<script src="../dist/vwg.js"></script>
<script>(function(){var d=document.documentElement;function set(t){if(t==='light'||t==='dark')d.setAttribute('data-theme',t);else d.removeAttribute('data-theme')}var q=new URLSearchParams(location.search).get('theme');if(q)set(q);addEventListener('message',function(e){var m=e.data;if(m&&m.type==='vwg-theme')set(m.theme)});function size(){if(parent!==window)parent.postMessage({type:'vwg-size',height:d.scrollHeight},'*')}addEventListener('load',function(){if(parent!==window)parent.postMessage({type:'vwg-ready'},'*');size();if(window.ResizeObserver)new ResizeObserver(size).observe(document.body)})})();</script><title>Button — preview</title></head>
<body class="vwg-paper">
<div class="vwg-row">
  <button class="vwg-btn vwg-btn-primary" type="button">Add to basket</button>
  <button class="vwg-btn vwg-btn-brick" type="button">Shop online</button>
  <button class="vwg-btn vwg-btn-outline" type="button">Get directions</button>
  <button class="vwg-btn vwg-btn-link" type="button">View all bags</button>
  <button class="vwg-btn vwg-btn-primary vwg-btn-sm" type="button">Add to basket</button>
  <button class="vwg-btn vwg-btn-primary" type="button" disabled>Sold out</button>
</div>
<div class="vwg-row vwg-band">
  <a class="vwg-btn vwg-btn-inverse" href="#">Shop online</a>
  <a class="vwg-btn vwg-btn-ghost" href="#">Find us</a>
</div>
</body>
</html>
