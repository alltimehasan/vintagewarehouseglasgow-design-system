<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/tokens.css">
<link rel="stylesheet" href="../dist/vwg.css">
<script src="../dist/vwg.js"></script>
<script>(function(){var d=document.documentElement;function set(t){if(t==='light'||t==='dark')d.setAttribute('data-theme',t);else d.removeAttribute('data-theme')}var q=new URLSearchParams(location.search).get('theme');if(q)set(q);addEventListener('message',function(e){var m=e.data;if(m&&m.type==='vwg-theme')set(m.theme)});function size(){if(parent!==window)parent.postMessage({type:'vwg-size',height:d.scrollHeight},'*')}addEventListener('load',function(){if(parent!==window)parent.postMessage({type:'vwg-ready'},'*');size();if(window.ResizeObserver)new ResizeObserver(size).observe(document.body)})})();</script><title>SiteHeader — preview</title></head>
<body>
<header class="vwg-header">
  <div class="vwg-container vwg-header-inner">
    <a class="vwg-logo" href="#" aria-label="Vintage Warehouse Glasgow, home">
      <img class="vwg-logo-light" src="../dist/images/logo-black.png" alt="" width="56" height="56">
      <img class="vwg-logo-dark" src="../dist/images/logo-white.png" alt="" width="56" height="56">
    </a>
    <nav class="vwg-nav" aria-label="Main">
      <a href="#" aria-current="page">Shop online</a>
      <a href="#">Find us</a>
      <a href="#">Contact us</a>
    </nav>
    <button class="vwg-menu-btn" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      Menu
    </button>
    <a class="vwg-basket" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      Basket <span class="vwg-basket-count">2</span>
    </a>
  </div>
</header>
</body>
</html>
