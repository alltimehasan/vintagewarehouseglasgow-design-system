<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/tokens.css?v=1.1.0-b87c207e">
<link rel="stylesheet" href="../dist/vwg.css?v=1.1.0-1d9d731a">
<script src="../dist/vwg.js?v=1.1.0-fe944742"></script>
<script>(function(){var d=document.documentElement;function set(t){if(t==='light'||t==='dark')d.setAttribute('data-theme',t);else d.removeAttribute('data-theme')}var q=new URLSearchParams(location.search).get('theme');if(q)set(q);addEventListener('message',function(e){var m=e.data;if(m&&m.type==='vwg-theme')set(m.theme)});function size(){if(parent!==window)parent.postMessage({type:'vwg-size',height:d.scrollHeight},'*')}addEventListener('load',function(){if(parent!==window)parent.postMessage({type:'vwg-ready'},'*');size();if(window.ResizeObserver)new ResizeObserver(size).observe(document.body)})})();</script><title>Field — preview</title></head>
<body class="vwg-paper">
<form class="vwg-form" style="padding: var(--space-6)" onsubmit="return false">
  <div class="vwg-field">
    <label for="name">Name</label>
    <input class="vwg-input" id="name" name="name" type="text" autocomplete="name" value="Sam Taylor">
  </div>
  <div class="vwg-field vwg-field-error">
    <label for="email">Email</label>
    <input class="vwg-input" id="email" name="email" type="email" autocomplete="email" value="sam@" aria-invalid="true" aria-describedby="email-hint">
    <p class="vwg-field-hint" id="email-hint">Enter an email address like name@example.com.</p>
  </div>
  <div class="vwg-field">
    <label for="message">Message</label>
    <textarea class="vwg-input" id="message" name="message" placeholder="Ask about a bag, a size, or a visit." aria-describedby="message-hint"></textarea>
    <p class="vwg-field-hint" id="message-hint">We reply within a working day.</p>
  </div>
  <div><button class="vwg-btn vwg-btn-primary" type="submit">Send message</button></div>
</form>
</body>
</html>
